<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Assistant - Card Back Section</title>
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <style>
      :root {
        --color-primary: #5b4fe9;
        --color-primary-hover: #4d41db;
        --color-primary-active: #4135c7;
        --color-status-orange: #ea580c;
        --color-status-orange-light: #fde8e8;
        --color-text-main: #172b4d;
        --color-text-sub: #64748b;
        --color-text-muted: #8c9bab;
        --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans', Ubuntu, sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font-family);
        color: var(--color-text-main);
        background-color: transparent;
        padding: 10px 12px;
        -webkit-font-smoothing: antialiased;
      }

      #section-container {
        display: flex;
        flex-direction: column;
        gap: 14px;
        width: 100%;
      }

      /* Middle Content: Ring & Info */
      .readiness-content {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      /* Circular Progress Ring */
      .ring-wrapper {
        position: relative;
        width: 76px;
        height: 76px;
        min-width: 76px;
        min-height: 76px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .progress-svg {
        width: 76px;
        height: 76px;
        transform: rotate(-90deg);
        transform-origin: 50% 50%;
      }

      .track-circle {
        fill: transparent;
        stroke: var(--color-status-orange-light);
        stroke-width: 8;
      }

      .progress-circle {
        fill: transparent;
        stroke: var(--color-status-orange);
        stroke-width: 8;
        stroke-linecap: round;
        stroke-dasharray: 201.06;
        stroke-dashoffset: 92.48; /* Default for 54% */
        transition: stroke-dashoffset 0.4s ease, stroke 0.3s ease;
      }

      .ring-center-text {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        user-select: none;
      }

      .score-value {
        font-size: 17px;
        font-weight: 700;
        line-height: 1.1;
        color: var(--color-status-orange);
      }

      .score-label {
        font-size: 11px;
        font-weight: 500;
        color: var(--color-text-muted);
        margin-top: 1px;
      }

      /* Eye icon overlay on hover */
      .ring-overlay {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.88);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.2s ease;
        backdrop-filter: blur(2px);
      }

      .ring-wrapper:hover .ring-overlay {
        opacity: 1;
      }

      .ring-overlay svg {
        width: 22px;
        height: 22px;
        stroke: var(--color-primary);
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Status Information */
      .status-info {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 3px;
      }

      .status-header {
        display: flex;
        align-items: center;
        gap: 7px;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: var(--color-status-orange);
        flex-shrink: 0;
      }

      .status-title {
        font-size: 15px;
        font-weight: 700;
        color: var(--color-status-orange);
      }

      .status-description {
        font-size: 13px;
        line-height: 1.35;
        color: var(--color-text-sub);
      }

      /* Primary Button */
      .btn-view-details {
        width: 100%;
        height: 38px;
        background-color: var(--color-primary);
        color: #ffffff;
        border: none;
        border-radius: 8px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        cursor: pointer;
        box-shadow: 0 2px 4px rgba(91, 79, 233, 0.2);
        transition: background-color 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
      }

      .btn-view-details:hover {
        background-color: var(--color-primary-hover);
        box-shadow: 0 4px 8px rgba(91, 79, 233, 0.28);
      }

      .btn-view-details:active {
        background-color: var(--color-primary-active);
        transform: scale(0.99);
      }

      .btn-view-details svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div id="section-container">
      <!-- Readiness Progress & Status Section -->
      <div class="readiness-content">
        <!-- SVG Circular Ring -->
        <div class="ring-wrapper" id="ring-wrapper" title="Click to view Readiness Score details">
          <svg class="progress-svg" viewBox="0 0 80 80">
            <circle class="track-circle" id="track-circle" cx="40" cy="40" r="32"></circle>
            <circle class="progress-circle" id="progress-circle" cx="40" cy="40" r="32"></circle>
          </svg>

          <!-- Centered text -->
          <div class="ring-center-text">
            <span class="score-value" id="score-value">54%</span>
            <span class="score-label" id="score-label">Score</span>
          </div>

          <!-- Hover eye icon overlay -->
          <div class="ring-overlay" id="ring-overlay">
            <svg viewBox="0 0 24 24">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </div>
        </div>

        <!-- Status & Description -->
        <div class="status-info">
          <div class="status-header">
            <span class="status-dot" id="status-dot"></span>
            <span class="status-title" id="status-title">Needs Work</span>
          </div>
          <p class="status-description" id="status-description">Missing critical information.</p>
        </div>
      </div>

      <!-- Action Button -->
      <button class="btn-view-details" id="btn-view-details">
        <!-- Sparkle Icon -->
        <svg viewBox="0 0 24 24">
          <path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4L12 2zM19 16l1.2 3.3L23.5 20.5l-3.3 1.2L19 25l-1.2-3.3-3.3-1.2 3.3-1.2L19 16z"/>
        </svg>
        <span>View Details</span>
      </button>
    </div>

    <!-- Logic Script -->
    <script type="module" src="/src/section.js"></script>
  </body>
</html>
